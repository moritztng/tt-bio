<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TT-Bio booth hardware</title>
<link rel="stylesheet" href="lanes.css">
</head>
<body>
<div id="hw"></div>
<script type="module">
  // Stand-alone page: ?view=lanes|compare|depth. It polls /telemetry twice a second; in the app the
  // same views are fed `chips` messages from the stream instead.
  import { mount } from "./lanes.js";
  const view = new URLSearchParams(location.search).get("view") || "lanes";
  const facts = await (await fetch("facts.json")).json();
  const v = mount(document.getElementById("hw"), view, facts);
  async function tick() {
    try { v.update(await (await fetch("/telemetry", { cache: "no-store" })).json()); } catch (e) {}
    setTimeout(tick, 500);
  }
  tick();
</script>
</body>
</html>
