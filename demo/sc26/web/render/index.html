<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sc26 render</title>
<style>
  html, body { margin: 0; height: 100%; background: #020306; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 16px; bottom: 12px; font: 13px/1.4 ui-monospace, monospace; color: #6b7a99;
         white-space: pre; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// Development harness. Not the booth app (that is web/app/); it plays one trajectory and lets you
// look, take stills and measure frame rate.
//   ?traj=fixtures/x.json  mode=auto|points|surface|glass|ribbon  scheme=chain|water|confidence
//   scale=0.75 (render scale)  msaa=4  speed=1  at=<s> (freeze at stream time s)  hud=1
//   null=1 (clear only: the cost of putting a canvas this size on screen at all)
//   shots=t1,t2 (post a 'shot' event as playback crosses each time)  loop=a,b (loop stream time a..b s)  bench=<s> (measure, POST to /bench)  hold=<s> (hold final)
const post = (o) => fetch('/bench', { method: 'POST', body: JSON.stringify(o) }).catch(() => {});
addEventListener('error', (e) => post({ kind: 'error', msg: String(e.message), at: e.filename + ':' + e.lineno }));
addEventListener('unhandledrejection', (e) => post({ kind: 'error', msg: String(e.reason?.stack ?? e.reason) }));
const { Renderer } = await import('./src/renderer.js');
const { loadTrajectory } = await import('./src/protocol.js');

const q = new URLSearchParams(location.search);
const num = (k, d) => q.has(k) ? parseFloat(q.get(k)) : d;
const canvas = document.getElementById('c');
const fit = () => { canvas.width = Math.round(innerWidth * devicePixelRatio); canvas.height = Math.round(innerHeight * devicePixelRatio); };
fit();
const r = new Renderer(canvas, { scale: num('scale', 1), msaa: num('msaa', 4), scheme: q.get('scheme') ?? 'chain',
  preserve: q.has('at'), skip: q.get('skip') ?? '' });
addEventListener('resize', () => { fit(); r.resize(); });

const tr = await loadTrajectory(q.get('traj') ?? 'fixtures/ubiquitin-76.json');
r.setTopology(tr.topo);
r.loadReplay(tr.frames);
r.speed = num('speed', 1);
r.setMode(q.get('mode') ?? 'auto');
const t0 = tr.frames[0].time, dur = r.timeline.duration, hold = num('hold', 6);
const loop = q.get('loop')?.split(',').map(Number);
if (q.has('at')) { r.seek(num('at', 0)); } else r.play();

const hud = document.getElementById('hud');
if (q.has('hud')) hud.style.display = 'block';
const gl = r.gl, dbg = gl.getExtension('WEBGL_debug_renderer_info');
const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

const keys = { '1': 'points', '2': 'surface', '3': 'glass', '4': 'ribbon', '0': 'auto' };
addEventListener('keydown', (e) => {
  if (keys[e.key]) r.setMode(keys[e.key]);
  if (e.key === ' ') r.playing ? r.pause() : r.play();
  if (e.key === 'r') r.seek(0);
  if (e.key === 'h') hud.style.display = hud.style.display === 'none' ? 'block' : 'none';
  if (e.key === 'c') r.setScheme(r.opt.scheme === 'chain' ? 'water' : 'chain');
});

const bench = num('bench', 0), intervals = [], phases = {};
let last = performance.now(), started = last, reported = false, readySent = false, shotIdx = 0;
const shots = q.get('shots')?.split(',').map(Number) ?? [];
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  if (now - started > 2000 && bench) {
    intervals.push(now - last);
    const ph = r.w.solid.x > 0.98 ? 'final' : (r.progress ?? 0) < 0.6 ? 'noise' : 'fold';
    (phases[ph] ??= []).push(now - last);
  }
  last = now;
  // replay loop: play, hold the final, start again
  if (!q.has('at')) {
    const t = r.clock - t0;
    if (loop && t > loop[1]) r.seek(loop[0]);
    else if (!loop && t > dur + hold) { r.seek(0); }
  }
  if (q.has('null')) { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.clearColor(0.01, 0.01, 0.02, 1); gl.clear(gl.COLOR_BUFFER_BIT); r.stats.frames++; }
  else r.render(q.has('at') ? 0.016 : dt);
  if (shots.length && r.clock - t0 >= shots[0] && r.stats.frames > 30) {
    const t = shots.shift(); post({ kind: 'shot', t, idx: shotIdx++, progress: r.progress, w: { ...Object.fromEntries(Object.entries(r.w).map(([k, v]) => [k, +v.x.toFixed(3)])) }, mesh: r.surf.last ?? null });
  }
  if (!readySent && r.stats.frames > 150 && (now - started) / 1000 > num('ready', 0)) {
    readySent = true; post({ kind: 'ready', gpu, w: canvas.width, h: canvas.height, mesh: r.surf.last ?? null });
  }
  if (hud.style.display !== 'none' && r.stats.frames % 15 === 0) {
    const s = r.surf.last;
    hud.textContent = `${gpu}\n${canvas.width}x${canvas.height} @ scale ${r.opt.scale}  msaa ${r.rt.samples}\n` +
      `t ${(r.clock - t0).toFixed(2)}/${dur.toFixed(1)} s  progress ${(r.progress ?? 0).toFixed(2)}  compact ${(r.compact ?? 0).toFixed(2)}\n` +
      `w pts ${r.w.points.x.toFixed(2)} surf ${r.w.surface.x.toFixed(2)} solid ${r.w.solid.x.toFixed(2)} grow ${r.w.grow.x.toFixed(2)} rib ${r.w.ribbon.x.toFixed(2)}\n` +
      (s ? `mesh ${s.ms.toFixed(1)} ms  ${s.ntri} tris  grid ${s.n.join('x')} h ${s.h.toFixed(2)}` : '');
  }
  if (bench && !reported && now - started > (2 + bench) * 1000) {
    reported = true;
    const iv = intervals.slice().sort((a, b) => a - b), pct = (p) => iv[Math.min(iv.length - 1, Math.floor(p * iv.length))];
    const sm = r.surf.ms.slice().sort((a, b) => a - b);
    const res = { kind: 'bench', gpu, width: canvas.width, height: canvas.height, scale: r.opt.scale, msaa: r.rt.samples,
      mode: q.get('mode') ?? 'auto', traj: q.get('traj'), natom: tr.topo.natom, nres: tr.topo.nres,
      frames: iv.length, seconds: bench, fps: iv.length / (iv.reduce((a, b) => a + b, 0) / 1000),
      p50: pct(0.5), p95: pct(0.95), p99: pct(0.99), worst: iv[iv.length - 1],
      over20ms: iv.filter(x => x > 20).length, over34ms: iv.filter(x => x > 34).length,
      meshes: sm.length, meshP50: sm[sm.length >> 1], meshMax: sm[sm.length - 1], ntri: r.surf.last?.ntri ?? 0,
      gpu50: r.stats.gpuMs.slice().sort((a, b) => a - b)[r.stats.gpuMs.length >> 1] ?? null, gpuN: r.stats.gpuMs.length, gpuMax: Math.max(0, ...r.stats.gpuMs),
      ua: navigator.userAgent, phases: Object.fromEntries(Object.entries(phases).map(([k, v]) => {
        v.sort((a, b) => a - b); return [k, { n: v.length, p50: v[v.length >> 1], p95: v[Math.floor(0.95 * v.length)], fps: v.length / (v.reduce((a, b) => a + b, 0) / 1000) }];
      })) };
    post(res);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
