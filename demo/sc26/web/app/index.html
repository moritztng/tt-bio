<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TT-Bio</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-state="attract">
<canvas id="stage"></canvas>

<header>
  <div class="marks"><img src="assets/tenstorrent-logo-reversed.svg" alt="Tenstorrent"><i></i><b>TT-Bio</b></div>
  <p id="sentence"></p>
  <div id="tag"><i></i><span></span></div>
</header>

<section id="typing">
  <div id="letters"></div>
  <p id="subline"></p>
  <p id="lenline"></p>
</section>

<aside id="side">
  <div id="label"></div>
  <div id="title"><h1 id="name"></h1><p id="story"></p></div>
  <div id="source"></div>
  <div id="number"><span id="num"></span></div>
  <div id="meta"></div>
  <div id="step"></div>
  <div id="legend"><p>Model confidence (pLDDT)</p><ul>
    <li><i style="background:#0053D6"></i>&gt; 90</li><li><i style="background:#65CBF3"></i>70–90</li>
    <li><i style="background:#FFDB13"></i>50–70</li><li><i style="background:#FF7D45"></i>&lt; 50</li></ul></div>
  <ol id="chips"></ol>
</aside>

<footer>
  <div id="qr"><img src="assets/qr-japanfold.svg" alt=""><p>Try it yourself<br><b>japanfold.aiand.com</b></p></div>
  <p id="invite"></p>
</footer>

<div id="keys"></div>
<iframe id="depth" tabindex="-1"></iframe>

<script type="module" src="app.js"></script>
</body>
</html>
