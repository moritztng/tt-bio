# Size-ladder rung, self-contained: the CIF path is repo-relative and there is no
# msa: key, so this runs anywhere the repo is checked out. laczc_256.yaml beside it
# points at /work/targets2 and /work/msa_sliced from the host it was authored on.
# No MSA matches the fold arm, which walks its ladder --single_sequence.
target:
  file: "perf/pxdesign/targets/laczc_256.cif"
  chains:
    A:
      hotspots: [128, 129, 130]
binder_length: 80
