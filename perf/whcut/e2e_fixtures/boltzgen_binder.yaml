# Self-contained BoltzGen binder spec for the §7.5 end-to-end check.
#
# examples/binder.yaml cannot be used over HTTP: it references
# ground_truth_structures/prot.cif by PATH, which a client cannot rely on the server
# resolving. This is the shape the platform's own DesignForm generates (genSpec, an
# inline target sequence with msa: empty and a binder length range), so it is what the
# service is actually asked for in normal use.
entities:
  - protein:
      id: B
      sequence: "80..120"
  - protein:
      id: A
      msa: empty
      sequence: "MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG"
