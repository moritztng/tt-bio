# Ligand-bearing rung of the 64-aa sweep behind the 704-token L1 crash fix. Same tiled
# CDK2 protein and same 20-heavy-atom ligand at every rung, so the only variable is the
# token count: N aa + 20 atoms, padded up to a multiple of PAIRFORMER_PAD_MULTIPLE=64.
sequences:
  - protein:
      id: A
      sequence: 
  - ligand:
      id: B
      smiles: 'Fc1ccc(cc1)C(=O)Nc1ccc(cc1)S(=O)(=O)N'
