# PVO RFD4 input: a 120-residue de-novo binder against 9TH6 chain A
# (448 modelled residues, 568 total tokens), hotspots from the deposited interface.
# Same shape as state/rfd4/inputs/pdl1-224.yaml; the target runs at its deposited size (state/pvo-tt.md).
9TH6_A_b120:
  input: 9TH6-A-b120.cif
  contig: "120-120, /0, A25-524"
  conditions:
    C_CRDGRP:
      1:
        - select: "sel('A/*/*/[N,CA,C,O]') and not has_nan_coord()"
    C_SEQ:
      true:
        - select: "sel('A')"
    C_HOT:
      true:
        - select: "sel('A/*/209/*')"
        - select: "sel('A/*/221/*')"
        - select: "sel('A/*/208/*')"
