# A boltzgen design whose pair track lands INSIDE the L1 window, so the exclusion at
# examples/binder.yaml can be reported as a bound rather than an anecdote.
#
# binder.yaml designs an 80..120 binder against a 117-residue target: ~200-237 tokens, pair N=256,
# which is the [1,256,256,64] shape the kernel LOSES on (0.952x on 110 cores) and which the window
# already excludes. 1ahw chain A is 214 residues, so the same binder length gives ~294-334 tokens
# and a pair N of 320 or 352 -- inside 288..352, where the kernel wins 1.59x at 320. Which side a
# bigger boltzgen design falls on is the open question; this fixes it.
entities:
  - protein:
      id: B
      sequence: 80..120
  - file:
      path: ../../examples/ground_truth_structures/1ahw.cif
      include:
        - chain:
            id: A
