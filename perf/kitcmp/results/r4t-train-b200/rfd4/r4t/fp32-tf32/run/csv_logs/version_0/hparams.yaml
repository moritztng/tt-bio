dataloaders:
  batch_size: 4
  num_workers: 16
  prefetch_factor: 8
  pin_memory: true
  multiprocessing_context: spawn
  metrics:
    num_workers: -1
  train:
    dataloader_params:
      batch_size: 1
      num_workers: 16
      prefetch_factor: 8
      pin_memory: true
      persistent_workers: true
      in_order: true
      drop_last: true
      multiprocessing_context: spawn
      collate_fn:
        _target_: rfproteina.datapipes.collate.collate_batch
        _partial_: true
        schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample
        keep_atom_array: false
        num_replicates: 4
        fixed_dimensions:
          I: 256
    n_fallback_retries: 4
    length_bucketing:
      enabled: false
      bucket_step: 64
      buckets:
      - 64
      - 128
      - 192
      - 256
      length_columns:
      - n_standard_amino_acid_residues
      - n_dna_residues
      - n_rna_residues
      - n_other_heavy_atoms
  val:
    dataloader_params:
      batch_size: 5
      num_workers: 4
      prefetch_factor: 1
      pin_memory: true
      persistent_workers: false
      drop_last: false
      multiprocessing_context: spawn
      collate_fn:
        _target_: rfproteina.datapipes.collate.collate_batch
        _partial_: true
        schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample
        fixed_dimensions:
          I:
          - 256
          - 320
          - 384
          - 448
          - 512
          - 560
          - 608
nn:
  name: local_latents_transformer
  output_parameterization:
    bb_ca: v
    local_latents: v
  sequence_readout:
    enabled: true
    detach: true
    num_classes: 147
  nlayers: 14
  token_dim: 768
  nheads: 12
  parallel_mha_transition: false
  token_type_emb_dim: 32
  cath_emb_dim: 32
  strict_feats: false
  noise_align_chirality: true
  noise_align_internal_coords: false
  noise_align_chirality_translate: false
  noise_align_internal_coords_translate: false
  use_atom37_factory: true
  feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - token_type
  - sequence_probabilities
  - cond_a37coors_nm
  - cond_a37coors_internal_nm
  - rasa_binned
  - secondary_structure
  - hbond_modernized
  - pistack
  - pication
  - saltbridge
  - hydrophobic
  - metal_coord
  - na_ss_state
  - hotspot
  - atom_charge
  - atomic_element
  - coord_group_seq
  - chirality
  - chain_centroid_xyz
  feats_cond_seq:
  - time_emb_bb_ca
  - time_emb_local_latents
  - cath_code
  - recycle_remaining
  dim_cond: 256
  idx_emb_dim: 256
  t_emb_dim: 256
  feats_pair_repr:
  - xt_bb_ca_pair_dists
  - bond_mask
  - bond_order
  - is_aromatic
  - index_group_pair
  - molecule_idx_pair
  - molecule_entity_pair
  - token_bond_path_length
  - canonical_polymer_ordering
  - na_ss_pair
  feats_pair_cond:
  - time_emb_bb_ca
  - time_emb_local_latents
  xt_pair_dist_dim: 30
  xt_pair_dist_min: 0.1
  xt_pair_dist_max: 3
  seq_sep_dim: 64
  pair_repr_dim: 384
  update_pair_repr: true
  update_pair_repr_every_n: 2
  use_tri_mult: true
  tri_mult_c: 256
  tri_mult_bias: false
  tri_mult_backend: cuequivariance
  recycle:
    enabled: true
    grad: last
    training_max_recycles: 9
    condition_probability: 0.5
  checkpointing: none
  pair_write: hadamard
  use_qkln: true
  attention_type: torch
  use_torch_compile: true
  norm_type: rmsnorm_torch_fused
generation:
  n_recycle: 0
  n_recycle_schedule:
  - - 5
    - 6
  - - 10
    - 5
  - - 5
    - 4
  - - 10
    - 3
  - - 20
    - 2
  - - 10
    - 1
  condition_on_recycle_remaining: true
  val_set_name_override: null
  args:
    nsteps: 60
    condition_decoder_on_sequence_prediction: true
    guidance_w: 1.0
    partial_trajectory_fraction_steps: null
    partial_t_backbone: null
    partial_t_latent: null
    couple_partial_t: false
    inverse_folding: false
    inverse_folding_method: resampled_forward_marginal
    save_trajectory_every: 0
    bb_ca_only_trajectories: true
    dump_noisy_trajectories: false
  model:
    bb_ca:
      schedule:
        mode: log
        p: 2.0
        tail_steps: 10
        tail_step_multiplier: 2
      gt:
        mode: 1/t
        p: 1.0
        clamp_val: null
      simulation_step_params:
        sampling_mode: vf_tsr
        sc_scale_noise: 1.0
        t_lim_ode: 0.95
        t_lim_ode_below: 0.02
        center_every_step: false
        tsr_k: 16.0
        tsr_sigma: 3.0
    local_latents:
      schedule:
        mode: power
        p: 2.0
        tail_steps: 10
        tail_step_multiplier: 2
      gt:
        mode: tan
        p: 1.0
        clamp_val: null
      simulation_step_params:
        sampling_mode: vf_tsr
        sc_scale_noise: 1.0
        t_lim_ode: 0.95
        t_lim_ode_below: 0.02
        center_every_step: false
        tsr_k: 4.0
        tsr_sigma: 12.0
  compile_lengths:
  - 256
  - 320
  - 384
  - 448
  - 512
  - 560
  - 608
metrics:
  inline_metrics:
    amino_acid_composition:
      _target_: rfproteina.metrics.amino_acid_composition.AminoAcidCompositionMetric
      aggregation:
      - mean
    bond_length_metrics:
      _target_: rfproteina.metrics.design_metrics.BondLengthMetric
      verbose: true
      required_tags_any:
      - design
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
    clash_metrics:
      _target_: rfproteina.metrics.design_metrics.ClashMetric
      threshold: 1.5
      required_tags_any:
      - design
      - structure_prediction
      prohibited_tags:
      - small_molecule_only
    hotspot_obedience:
      _target_: rfproteina.metrics.hotspots.HotspotObedience
      max_hotspot_distance: 4.5
      required_tags_any:
      - hotspot_conditioning
    rasa_adherence:
      _target_: rfproteina.metrics.rasa_metrics.RasaAdherenceMetric
      required_tags_any:
      - rasa_conditioning
    centroid_conditioning_adherence:
      _target_: rfproteina.metrics.centroid_metrics.CentroidConditioningAdherenceMetric
      required_tags_any:
      - centroid_conditioning
    interchain_interactions:
      _target_: rfproteina.metrics.interaction_metrics.InterchainInteractionMetric
      required_tags_any:
      - interchain_interactions
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
    sequence_adherence:
      _target_: rfproteina.metrics.sequence_adherence_metric.SequenceAdherenceMetric
      required_tags_any:
      - design
    sequence_probability_adherence:
      _target_: rfproteina.metrics.sequence_adherence_metric.SequenceProbabilityAdherenceMetric
      required_tags_any:
      - design
    sse_distribution:
      _target_: rfproteina.metrics.sse_metrics.SecondaryStructureDistribution
      required_tags_any:
      - design
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
    sse_accuracy:
      _target_: rfproteina.metrics.sse_metrics.SecondaryStructureAccuracy
      required_tags_any:
      - design
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
    posebusters_metrics:
      _target_: rfproteina.metrics.posebusters_metrics.PoseBustersMetric
      atom_array_input_key: predicted_atom_array
      required_tags_any:
      - small_molecule_only
    chiral_accuracy:
      _target_: rfproteina.metrics.chiral_metric.ChiralAccuracy
      subset_mask: is_ligand
      required_tags_any:
      - has_small_molecule
    design_motif_allatom_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: sa_mask('SA_CRDSRC')
      subset_mask: sa_mask('SA_CRDSRC')
      subdivide_by_annotation: condition_CoordinateGroup_1_atom
      gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
      metric_type: rmsd
      aggregation:
      - median
      input_kwarg_names:
        ground_truth_atom_array: predicted_atom_array
        predicted_atom_array: predicted_atom_array
      required_tags_any:
      - 3d_coordinate_conditioning
      - unindexed
      - internal_coordinate_conditioning
    design_unindexed_motif_allatom_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: sa_mask('SA_CRDSRC') & is_unindexed_insertion
      subset_mask: sa_mask('SA_CRDSRC') & is_unindexed_insertion
      subdivide_by_annotation: condition_CoordinateGroup_1_atom
      gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
      metric_type: rmsd
      aggregation:
      - median
      input_kwarg_names:
        ground_truth_atom_array: predicted_atom_array
        predicted_atom_array: predicted_atom_array
      required_tags_all:
      - unindexed
    unindexed_insertion_mapping:
      _target_: rfproteina.metrics.unindexed_insertion_metric.UnindexedInsertionMappingMetric
      required_tags_all:
      - unindexed
    contact_molecular_surface:
      _target_: rfproteina.metrics.physics.contact_ms.metric.ContactMolecularSurfaceMetric
      required_tags_any:
      - cms
    sequence_similarity_to_input:
      _target_: rfproteina.metrics.design_metrics.SequenceSimilarityToInput
      required_tags_any:
      - partial_diffusion
    ca_rmsd_to_input:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: is_protein & (atom_name == 'CA')
      subset_mask: is_protein & (atom_name == 'CA')
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - partial_diffusion
    cath_metric:
      _target_: rfproteina.metrics.cath_metric.CathMetric
      required_tags_any:
      - cath
      annotator: foldseek_with_fallback
    structure_prediction_lddt:
      _target_: rfproteina.metrics.lddt_metric.AllAtomLDDT
      predicted_atom_array_key: predicted_atom_array
      ground_truth_atom_array_key: ground_truth_atom_array
      required_tags_any:
      - structure_prediction
    sequence_developability:
      _target_: rfproteina.metrics.physics.developability_metrics.SequenceDevelopabilityMetric
      required_tags_any:
      - developability
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
    rosetta_developability:
      _target_: rfproteina.metrics.physics.developability_metrics.RosettaDevelopabilityMetric
      required_tags_any:
      - developability
      prohibited_tags:
      - small_molecule_only
      - structure_prediction
      sasa_cutoff: 20.0
    antibody_contacts:
      _target_: rfproteina.metrics.antibody_metrics.AntibodyContacts
      required_tags_any:
      - antibody
      contact_threshold: 7.0
  refolding_metrics:
    refolded_backbone_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: is_protein_backbone
      subset_mask: is_protein_backbone
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - unconditional_refolding
      - ppi_refolding
      - antibody
      - dna_refolding
      - motif_scaffold_refolding
      - internal_coordinate_motif_scaffold_refolding
      - sm_binder_refolding
      - ame_refolding
      - ame_no_ligand_refolding
      - ame_original_benchmark_refolding
      - disco_refolding
      required_tags_all:
      - is_refold:untransformed
    refolded_target_aligned_binder_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: ~is_chain_of_interest & (sa_mask('C_CRD') | is_dna)
      subset_mask: is_chain_of_interest & is_protein
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - ppi_refolding
      - dna_refolding
      - antibody
      required_tags_all:
      - is_refold:untransformed
    refolded_target_backbone_aligned_binder_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: ~is_chain_of_interest & sa_mask('C_CRD') & is_protein_backbone
      subset_mask: is_chain_of_interest & is_protein
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - ppi_refolding
      required_tags_all:
      - is_refold:untransformed
    refolded_motif_allatom_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: sa_mask('SA_CRDSRC') & is_protein
      subset_mask: sa_mask('SA_CRDSRC') & is_protein
      subdivide_by_annotation: condition_CoordinateGroup_1_atom
      gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - motif_scaffold_refolding
      - internal_coordinate_motif_scaffold_refolding
      - ame_refolding
      - ame_no_ligand_refolding
      - ame_original_benchmark_refolding
      required_tags_all:
      - is_refold:untransformed
    refolded_motif_ca_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: sa_mask('SA_CRDSRC') & is_protein & (atom_name == 'CA')
      subset_mask: sa_mask('SA_CRDSRC') & is_protein & (atom_name == 'CA')
      subdivide_by_annotation: condition_CoordinateGroup_1_atom
      gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - motif_scaffold_refolding
      - internal_coordinate_motif_scaffold_refolding
      required_tags_all:
      - is_refold:untransformed
    refolded_backbone_aligned_ligand_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: is_protein_backbone
      subset_mask: is_ligand
      metric_type: rmsd
      aggregation:
      - median
      required_tags_any:
      - sm_binder_refolding
      required_tags_all:
      - is_refold:untransformed
    refolded_apo_holo_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: is_protein_backbone & ~sa_mask('C_CRD')
      subset_mask: is_protein_backbone & ~sa_mask('C_CRD')
      metric_type: rmsd
      aggregation:
      - median
      input_kwarg_names:
        ground_truth_atom_array: refold.apo
        predicted_atom_array: refold.untransformed
      required_tags_all:
      - is_refold:apo
      - exists_refold:untransformed
    max_ligand_centroid_distance:
      _target_: rfproteina.metrics.gt_structure_comparison.LigandCentroidDistanceMetric
      align_mask: is_protein_backbone
      aggregation: max
      required_tags_any:
      - disco_refolding
      required_tags_all:
      - is_refold:untransformed
  pass_criteria:
    unconditional:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        refolded_backbone_rmsd.rmsd:
          max: 1.5
      required_tags_any:
      - unconditional_refolding
    ppi:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        oracle_ppi.ptm_coi:
          min: 80.0
        oracle_ppi.min_ipae_coi:
          max: 1.5
        refolded_target_backbone_aligned_binder_rmsd.rmsd:
          max: 2.5
      required_tags_any:
      - ppi_refolding
    antibody:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        oracle_ppi.min_ipae_coi:
          max: 2.0
        refolded_target_aligned_binder_rmsd.rmsd:
          max: 2.0
      required_tags_any:
      - antibody
    dna:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        oracle_dna.min_ipae_coi:
          max: 1.5
        refolded_target_aligned_binder_rmsd.rmsd:
          max: 8.0
      required_tags_any:
      - dna_refolding
    motif_scaffold:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        refolded_backbone_rmsd.rmsd:
          max: 2.0
