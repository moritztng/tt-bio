    multiprocessing_context: spawn
    metrics:
      num_workers: -1
    train:
      dataloader_params:
        batch_size: 1
        num_workers: 16
        prefetch_factor: 8
        pin_memory: true
        persistent_workers: true
        in_order: true
        drop_last: true
        multiprocessing_context: spawn
        collate_fn:
          _target_: rfproteina.datapipes.collate.collate_batch
          _partial_: true
          schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample
          keep_atom_array: false
          num_replicates: 4
          fixed_dimensions:
            I: 256
      n_fallback_retries: 4
      length_bucketing:
        enabled: false
        bucket_step: 64
        buckets:
        - 64
        - 128
        - 192
        - 256
        length_columns:
        - n_standard_amino_acid_residues
        - n_dna_residues
        - n_rna_residues
        - n_other_heavy_atoms
    val:
      dataloader_params:
        batch_size: 5
        num_workers: 4
        prefetch_factor: 1
        pin_memory: true
        persistent_workers: false
        drop_last: false
        multiprocessing_context: spawn
        collate_fn:
          _target_: rfproteina.datapipes.collate.collate_batch
          _partial_: true
          schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample
          fixed_dimensions:
            I:
            - 256
            - 320
            - 384
            - 448
            - 512
            - 560
            - 608
