[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-bio"
version = "0.6.6"
description = "Boltz-2, ESMFold2, Protenix-v2, OpenFold3, and OpenDDE structure prediction, BoltzGen/RFdiffusion3 design, and ESMC/SaProt protein embeddings for inference on Tenstorrent Blackhole and Wormhole"
readme = "README.md"
requires-python = ">=3.10,<3.13,!=3.11.*"
dependencies = [
    "torch",
    "numpy",
    "rdkit",
    "requests",
    "pandas",
    "einops",
    "mashumaro",
    "modelcif",
    "click",
    "pyyaml",
    "omegaconf",  # only needed to unpickle DictConfig objects baked into upstream ckpts
    "biopython",
    "biotite",
    "matplotlib",
    "scipy",
    "numba",
    "gemmi",
    "scikit-learn",
    "chembl_structure_pipeline",
    "hydride",
    "pydssp",
    "tqdm",
    "rich",
    "huggingface_hub>=1.5.0,<2.0",  # esmc.py weight download; transformers>=5.3 requires >=1.5.0
    "safetensors",          # esmc.py: safe_open for the sharded 6B checkpoint
    # ESMFold2 reference code is vendored under tt_bio/_vendor (see NOTICE); these
    # are the stock PyPI runtime deps it needs — no git clones / external repos.
    # >=5.5.0 clears all 3 open dependabot alerts (#3 Trainer RCE fixed 5.0.0rc3,
    # #4 config.json RCE fixed 5.3.0, #5 LightGlue RCE fixed 5.5.0 -- N/A to tt-bio,
    # no LightGlue usage). CPU-level bit-exact parity verified (transformers
    # 4.57.6 -> 5.5.0/5.14.1, same torch, same weights, same seed):
    # ~/.coworker/state/tt-bio-dependabot-transformers-triage.md.
    "transformers>=5.5.0,<6.0",  # the vendored ESMFold2 model runs on the stock transformers core
    "zstd",                  # esm MSA utils (vendored)
    "msgpack-numpy",         # esm structure serialization (vendored)
    "brotli",                # esm (vendored)
    "cloudpathlib",          # esm (vendored)
    # Protenix-v2 adds NO new dependencies: the on-device model + its data pipeline are
    # pure torch/ttnn (canonical-CCD conformers bundled as JSON, no rdkit/gemmi at runtime),
    # and weights come from the Hugging Face mirror via huggingface_hub (no clone).
    # OpenFold3's vendored host-side data pipeline (see NOTICE #5) DOES: these five are
    # imported at module load, so without them `--model openfold3` dies on a clean
    # install with ModuleNotFoundError before it ever reaches a card. All pure-Python.
    "pydantic",           # openfold3 query schema + msa/template pipeline configs
    "pdbeccdutils",       # CCD component lookup
    "func_timeout",       # RDKit conformer-embedding timeout guard
    "networkx",           # CCD bond-graph connected components
    "packaging",          # tt_bio/_vendor/openfold3/__init__.py version check
    # RF3 vendors AtomWorks (see NOTICE #7) for host featurization. typing_extensions
    # backs the 3.10 shim for typing.Never.
    "toolz",          # atomworks imports toolz directly, cytoolz is separate
    "cytoolz",
    "typing_extensions",
    # These four are NOT transitive, and their absence is not an import-time error
    # a smoke test catches: `tt_bio.rf3` imports fine without them and the fold dies
    # in featurization instead. Found by folding trpcage through --model rf3 in an
    # env built from this file (2026-08-22): it failed once per package. zstandard is
    # a different distribution from the "zstd" above, which covers the vendored esm
    # MSA utils only. pyarrow turned up only on the release venv (ttnn 0.68.0 /
    # torch 2.13.0) on qb1, because the dev env that found the first three already
    # had it transitively.
    "zstandard",      # atomworks io/utils/compression.py, ml/utils/io.py
    "beartype",       # rf3 data/ground_truth_template.py
    "jaxtyping",      # atomworks ml/conditions/annotator.py
    "pyarrow",        # atomworks ml/utils/io.py, reached from rf3 data/pipelines.py
    # RF3's torch reference (tt_bio/_vendor/rf3/model, the thing the ttnn port is
    # scored against) contracts with opt_einsum rather than torch.einsum. Keeping
    # it means the reference's contraction order, and so its float results, match
    # upstream exactly.
    "opt_einsum",
    # ttnn is NOT here on purpose: it only publishes wheels for TT-supported
    # platforms, and the Boltz-2 CPU/GPU path + CLI must install and run without
    # it (issue #6). It lives in the `tenstorrent` extra below.
]

[project.optional-dependencies]
test = ["pytest"]
# Upstream reference packages that a scripts/*_parity.py harness imports IN-PROCESS
# from an external checkout (OPENDDE_SRC), so they cannot sit in a separate reference
# venv the way the boltz/protenix fixture harnesses do. Nothing in tt_bio imports these.
reference = ["ml_collections"]  # opendde.config.config -> ml_collections.config_dict.ConfigDict
# Tenstorrent execution (the default --accelerator): pip install 'tt-bio[tenstorrent]'.
# Without it, `tt-bio --help` and --accelerator cpu/gpu still work; requesting a card
# fails with a clear message naming this extra.
tenstorrent = ["ttnn==0.68.0"]

[project.scripts]
tt-bio = "tt_bio.main:cli"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["tt_bio*"]

[tool.setuptools.package-data]
# ship the vendored third-party license texts inside the wheel (see NOTICE)
"tt_bio._vendor.esm" = ["LICENSE"]
"tt_bio._vendor.esmfold2_hf" = ["LICENSE"]
"tt_bio._vendor.openfold3" = ["LICENSE"]
"tt_bio._vendor.atomworks" = ["LICENSE", "py.typed", "io/tools/*.smirks", "ml/datasets/*.md"]
"tt_bio._vendor.rf3" = ["LICENSE"]
"tt_bio._vendor.foundry" = ["LICENSE"]
# runtime data files the package loads by path at import/featurize time — these
# MUST ship in the wheel/sdist or a clean `pip install` crashes (see v0.3.4 changelog):
#   - tt_bio/data/protein_ref_conformers.json: protenix-v2 + opendde featurization
#   - tt_bio/boltzgen/resources/**: every `tt-bio design --model boltzgen` run (config yamls, splits, metrics)
"tt_bio.data" = ["*.json"]
"tt_bio.boltzgen" = ["LICENSE"]
"tt_bio.boltzgen.resources" = ["*.json"]
"tt_bio.boltzgen.resources.config" = ["*.yaml"]
"tt_bio.boltzgen.resources.splits" = ["*.txt"]
# kernel sources: tt_bio/reblock_permute.py, tt_bio/mm_generic.py (triatt /
# triatt_sdpa / trimul fused kernels) and friends load them by path
# (KERNEL_DIR, ttnn KernelDescriptor FILE_PATH) on the DEFAULT path, so a clean
# install without them crashes on the first eligible call. Attached to the
# tt_bio package because tt_bio/kernels/ is not itself a package. Recursive
# globs so a NEW kernel dir cannot silently drop out of the wheel again
# (the v0.3.3 / reblock_permute / triatt_sdpa bug class).
"tt_bio" = ["kernels/**/*.cpp", "kernels/**/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
