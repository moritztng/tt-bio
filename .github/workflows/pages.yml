name: Publish the perf page

# Manual only. There is no push trigger: the page goes live when someone runs this workflow by
# hand, and GitHub Pages is not enabled on this repo yet.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the data file parses
        run: python3 -c "import json;json.load(open('site/data/perf-512aa.json'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
