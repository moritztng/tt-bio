name: Publish the perf page

# Manual only. There is no push trigger: a change to site/ goes live when someone runs this
# workflow by hand, which is what keeps a half-checked number off https://moritztng.github.io/tt-bio/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the data file parses
        run: python3 -c "import json;json.load(open('site/data/perf-512aa.json'))"
      - name: Check no published row is missing a processor column
        run: python3 scripts/site_publish_guard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
