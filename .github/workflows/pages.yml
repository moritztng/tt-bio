name: Publish the perf page

# Manual only. There is no push trigger: a change to site/ goes live when someone runs this
# workflow by hand, which is what keeps a half-checked number off https://moritztng.github.io/tt-bio/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the data file parses
        run: python3 -c "import json;json.load(open('site/data/perf-512aa.json'))"
      - name: Check no published row is missing a processor column
        run: python3 scripts/site_publish_guard.py
      - name: Check every local link resolves
        run: python3 scripts/site_link_check.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
