name: Publish the perf page

# Manual only. There is no push trigger: a change to site/ goes live when someone runs this
# workflow by hand, which is what keeps a half-checked number off https://moritztng.github.io/tt-bio/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the data file parses
        run: python3 -c "import json;json.load(open('site/data/perf-512aa.json'))"
      - name: Check no published row is missing a processor column
        run: python3 scripts/site_publish_guard.py
      - name: Check every local link resolves
        run: python3 scripts/site_link_check.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
