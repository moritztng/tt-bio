name: ci

# Host-only checks. TT hardware is not available on GitHub runners, so device/parity
# tests are NOT run here — they gate releases on real cards before a tag is cut.
# This job proves the package builds, is publishable, and imports without a card.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Import check (no card, no heavy deps)
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import tt_bio; print('tt_bio', tt_bio.__version__)"
      # The packaging gate's own tests. Card-free, no model deps, ~3s. Its live legs are
      # the ones that matter here: a third-party import nobody declared, or a data path
      # that moved out from under the --fold leg's markers, fails on the PR that adds it
      # instead of at the next tag.
      - name: Packaging gate tests
        run: |
          # tomli is the <3.11 fallback packaging_smoke.py reads pyproject with, and this
          # job pins 3.10.
          python -m pip install pytest tomli
          python -m pytest tests/test_packaging_smoke.py -q
