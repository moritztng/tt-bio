[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "japanfold"
version = "1.0.0"
description = "JapanFold CLI — biomolecular structure prediction & binder design on Tenstorrent."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# Intentionally dependency-free (stdlib only) so it installs anywhere an agent runs.
dependencies = []
keywords = ["protein", "structure-prediction", "boltz", "esmfold", "binder-design", "bioinformatics"]

[project.urls]
Homepage = "https://japanfold.com"
Documentation = "https://japanfold.com/docs"

[project.scripts]
japanfold = "japanfold_cli:main"

[tool.setuptools]
py-modules = ["japanfold_cli"]
